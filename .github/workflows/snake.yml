name: Generate profile assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # before snk: its Docker container creates dist/ as root
      - name: Render heart-monitor activity card
        run: python3 scripts/ecg.py ${{ github.repository_owner }} dist/ecg.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#1D4ED8&color_dots=#EBEDF0,#BFDBFE,#60A5FA,#2563EB,#1E3A8A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#60A5FA&color_dots=#161B22,#0C2D5E,#1D4ED8,#3B82F6,#60A5FA

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
